name: bamboolab-monitor

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [bamboolab-monitor]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      BACKEND_PORT: 3000
      SETTINGS_PATH: /app/data/printer-settings.json
    volumes:
      - app_data:/app/data
      - ./certs:/app/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [bamboolab-monitor]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:3000
    ports:
      - 8088:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [bamboolab-monitor]

networks:
  bamboolab-monitor:
    name: bamboolab-monitor
    driver: bridge

volumes:
  mysql_data:
  app_data:
